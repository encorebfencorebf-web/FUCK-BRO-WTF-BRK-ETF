name: Android Build
on:
  workflow_dispatch:
    inputs:
      pin_date:
        description: "Tanggal pin library (YYYY-MM-DD)"
        required: true
        default: "2025-11-17"
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v2
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-pinned
      - name: Installing libraries (pinned by date)
        env:
          PIN_DATE: ${{ inputs.pin_date }}
        run: |
          haxelib newrepo
          haxelib install hxcpp --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install lime 8.1.2 --quiet
          haxelib install hxvlc 1.9.3 --skip-dependencies --quiet
          haxelib install format --quiet
          haxelib install markdown --quiet
          haxelib install nape-haxe4 --quiet
          pin() { # nama url [branch]
            rm -rf "/tmp/$1"
            if [ -n "$3" ]; then
              git clone --quiet -b "$3" "$2" "/tmp/$1"
            else
              git clone --quiet "$2" "/tmp/$1"
            fi
            SHA=$(git -C "/tmp/$1" rev-list -n 1 --before="$PIN_DATE" HEAD)
            echo "PIN $1 -> $SHA"
            echo "LIBSXML <git name=\"$1\" url=\"$2\" ref=\"$SHA\" />"
            haxelib git "$1" "$2" "$SHA"
          }
          pin flixel https://github.com/CodenameCrew/cne-flixel
          pin flixel-addons https://github.com/CodenameCrew/cne-flixel-addons
          pin hscript-improved https://github.com/CodenameCrew/hscript-improved custom-classes
          pin flxanimate https://github.com/CodenameCrew/cne-flxanimate
          pin hxdiscord_rpc https://github.com/CodenameCrew/cne-hxdiscord_rpc
          pin away3d https://github.com/CodenameCrew/away3d
          pin extension-androidtools https://github.com/MAJigsaw77/extension-androidtools
          haxelib list
          haxelib run lime rebuild hxcpp
      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Building the game
        run: |
          haxelib run lime build android -final
      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
            	const caches = await github.rest.actions.getActionsCacheList({
            		owner: context.repo.owner,
            		repo: context.repo.repo,
            	})
            	if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
            		for (const cache of caches.data.actions_caches) {
            			if (cache.key == "cache-android-pinned") {
            				console.log('Clearing ' + cache.key + '...')
            				await github.rest.actions.deleteActionsCacheById({
            					owner: context.repo.owner,
            					repo: context.repo.repo,
            					cache_id: cache.id,
            				})
            				console.log("Previous Cache Cleared!")
            			}
            		}
            	}
            } catch (error) {
            	console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-pinned
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
