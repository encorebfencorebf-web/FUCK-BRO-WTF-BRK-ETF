name: Android Build (iOS style)
on: workflow_dispatch
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Install Libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
          haxelib remove lime
          haxelib git lime https://github.com/th2l-devs/lime --quiet
          haxelib run lime rebuild hxcpp

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -final

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: CodenameEngineLegacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
          if-no-files-found: error
